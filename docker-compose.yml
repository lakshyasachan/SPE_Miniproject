# Fixed project name so containers are always named the same, whichever folder Compose runs from
# (Jenkins runs it from its workspace). This keeps re-runs idempotent.
name: spe-calculator

services:
  calculator:
    # Jenkins sets IMAGE_TAG to the build number; locally it falls back to "latest"
    image: lakshyasachan/calculator:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      # Read automatically by the JVM: cap the heap so the container stays small
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    # No ports published: the API is only reachable through Nginx
    expose:
      - "8080"
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    restart: unless-stopped
    # Start Nginx only once the API reports healthy
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to IPv6, where Nginx isn't listening
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  calc-net:
    driver: bridge
