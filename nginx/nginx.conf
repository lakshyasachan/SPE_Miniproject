server {
    listen 80;

    # Docker's internal DNS. Looking the name up on each request (instead of once at startup)
    # means Nginx still finds the API after Jenkins redeploys it with a new container IP.
    resolver 127.0.0.11 valid=10s;
    set $calculator http://calculator:8080;

    # Health check for the Nginx container itself
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }

    # Forward everything else to the calculator API
    location / {
        proxy_pass $calculator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
